<body>
<div class="game">
  <div class="hud">
    <div class="score">得分 <b id="score">0</b></div>
    <div class="best">最高 <b id="best">0</b></div>
  </div>

  <div class="stage">
    <canvas id="board" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ovTitle">贪吃蛇</h1>
      <p id="ovText">方向键或 WASD 控制<br>吃到食物让蛇变长</p>
      <button class="btn" id="startBtn">开始游戏</button>
      <div class="hint" id="ovHint">按 <kbd>空格</kbd> 也可开始 / 暂停</div>
    </div>
  </div>

  <div class="hint">移动：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>　　暂停：<kbd>空格</kbd></div>

  <div class="touch">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovHint = document.getElementById('ovHint');
  const startBtn = document.getElementById('startBtn');

  const CELL = 24;
  const COLS = canvas.width / CELL;   // 20
  const ROWS = canvas.height / CELL;  // 20

  let snake, dir, nextDirQueue, food, score, best, speed, acc, lastTime, running, paused, rafId;

  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDirQueue = [];
    score = 0;
    speed = 7;          // 每秒移动格数
    acc = 0;
    lastTime = 0;
    paused = false;
    scoreEl.textContent = score;
    placeFood();
    draw();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function queueDir(nx, ny) {
    // 以“最后一次有效方向”为准，避免快速按键时反向
    const base = nextDirQueue.length ? nextDirQueue[nextDirQueue.length - 1] : dir;
    if (base.x === -nx && base.y === -ny) return;      // 不能 180° 掉头
    if (base.x === nx && base.y === ny) return;        // 重复方向忽略
    if (nextDirQueue.length < 2) nextDirQueue.push({ x: nx, y: ny });
  }

  const keyMap = {
    ArrowUp: [0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!running) startGame();
      else togglePause();
      return;
    }
    const m = keyMap[e.code];
    if (m) {
      e.preventDefault();
      queueDir(m[0], m[1]);
      if (!running) startGame(); // 首次按键直接开局
    }
  });

  document.querySelectorAll('.touch button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      queueDir(map[d][0], map[d][1]);
      if (!running) startGame();
    });
  });

  startBtn.addEventListener('click', startGame);

  // 键盘焦点不在 canvas 时也能暂停，这里只用一个总控
  function startGame() {
    reset();
    running = true;
    paused = false;
    lastTime = performance.now();
    overlay.classList.add('hidden');
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    paused = !paused;
    if (paused) {
      ovTitle.textContent = '已暂停';
      ovText.textContent = '按空格或点击按钮继续';
      ovHint.textContent = '';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    ovTitle.textContent = '游戏结束';
    ovText.innerHTML = '本局得分 <b style="color:var(--accent)">' + score + '</b>';
    ovHint.innerHTML = '按 <kbd>空格</kbd> 或点击按钮重新开始';
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function update() {
    if (nextDirQueue.length) dir = nextDirQueue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 撞自己（允许移动到当前尾巴所在的格子，因为尾巴会移走）
    const hitsSelf = snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y);
    if (hitsSelf) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      speed = Math.min(16, 7 + score * 0.35);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function loop(t) {
    if (!running) return;
    if (!paused) {
      const dt = (t - lastTime) / 1000;
      lastTime = t;
      acc += dt;
      const step = 1 / speed;
      while (acc >= step) {
        acc -= step;
        update();
        if (!running) return;
      }
    } else {
      lastTime = t;
    }
    rafId = requestAnimationFrame(loop);
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 背景棋盘
    ctx.fillStyle = '#16212e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.018)';
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    // 食物
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(performance.now() / 260) * 0.08;
    ctx.save();
    ctx.shadowColor = 'rgba(255,92,92,.8)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath();
    ctx.arc(fx, fy, (CELL / 2 - 4) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(fx - 3, fy - 3, 2.4, 0, Math.PI * 2);
    ctx.fill();

    // 蛇
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const px = s.x * CELL;
      const py = s.y * CELL;
      const t = i / Math.max(1, snake.length - 1);
      if (i === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(53,208,127,.7)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#4ee79a';
        ctx.restore();
        roundRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3, 8);
        ctx.fillStyle = '#4ee79a';
        ctx.fill();
        // 眼睛
        const ex = dir.x, ey = dir.y;
        const cxp = px + CELL / 2, cyp = py + CELL / 2;
        const off = CELL * 0.20;
        const eyeR = 2.2;
        ctx.fillStyle = '#0c1a12';
        const perpX = -ey, perpY = ex;
        for (const sgn of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(cxp + ex * off + perpX * off * sgn * 0.9, cyp + ey * off + perpY * off * sgn * 0.9, eyeR, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        const g = Math.round(210 - t * 70);
        ctx.fillStyle = `rgb(${Math.round(38 + (1 - t) * 20)}, ${g}, ${Math.round(120 - t * 30)})`;
        roundRect(px + 2, py + 2, CELL - 4, CELL - 4, 7);
        ctx.fill();
      }
    }
  }

  // 初始画面
  reset();
})();
</script>
